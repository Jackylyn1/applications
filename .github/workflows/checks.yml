name: checks

# CI runs the same Makefile targets a developer runs locally, so "green here"
# and "green on my machine" cannot drift apart.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install tooling
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt -r requirements.txt

      # Called directly rather than through `make check`, so a failing tool is
      # named in the job summary instead of hiding behind one Make target.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: bandit -q -ll -c pyproject.toml -r career-kb/tools tests
      - run: xenon -b C -m B -a A career-kb/tools tests
      - run: vulture
      - run: coverage run -m pytest
      - run: coverage report

      - run: pip-audit -r requirements.txt

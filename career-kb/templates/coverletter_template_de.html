<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Anschreiben - $name - $company</title>
<style>
  @page { size: A4; margin: 15mm 18mm 12mm 18mm; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Carlito", "Calibri", "Helvetica Neue", Arial, sans-serif;
    font-size: 10.2pt;
    line-height: 1.38;
    color: #1a1a1a;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .name { font-size: 16pt; font-weight: 700; letter-spacing: .2px; }
  .tagline { font-size: 10pt; color: #333; margin-top: 1px; }
  .contact { font-size: 9pt; color: #444; margin-top: 3px; }
  .rule { border-bottom: 1px solid #b9b9b9; margin: 6px 0 11px 0; }
  .addrblock { width: 100%; }
  .addrblock td { vertical-align: top; font-size: 10pt; }
  .addrblock td.right { text-align: right; white-space: nowrap; }
  .subject { font-weight: 700; margin: 13px 0 11px 0; }
  p { margin: 0 0 8px 0; text-align: justify; }
  .salutation { margin-bottom: 9px; }
  .signature { margin-top: 10px; font-weight: 600; }
  /* Scanned ink on the same white as the page, so it needs no transparency. */
  .signature img { display: block; height: 12mm; margin: 2px 0 1px -2px; }
</style>
</head>
<body>

  <div class="name">$name</div>
  <div class="tagline">$tagline</div>
  <div class="contact">Gelsenkirchen | +49 152 13839296 | info@perfectseowebsite.de | github.com/Jackylyn1</div>
  <div class="rule"></div>

  <table class="addrblock">
    <tr>
      <td>
        $addressee
      </td>
      <td class="right">$place_date</td>
    </tr>
  </table>

  <div class="subject">
    $subject
  </div>

  <p class="salutation">$salutation</p>

$body

  <p>$closing</p>
  <p class="signature"><img src="$signature" alt="Unterschrift $name">$name</p>

</body>
</html>
